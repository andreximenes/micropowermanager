# Disable some built-in rules
config:
  line-length: false
  no-inline-html: false
  first-line-h1: false
  code-fence-style:
    style: backtick
  # Indexes such as LEGACY_SCREENS.md repeat the same subheadings under every screen.
  no-duplicate-heading:
    siblings_only: true

# Define glob expressions to use (only valid at root)
globs:
  - "**/*.md"

# Ignore files that are not part of version control
gitignore: true
